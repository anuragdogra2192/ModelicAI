<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Anurag Dogra" />
    <title>ModelicAI Studio</title>
    <script>
      // Apply the saved theme before first paint (no flash of the wrong colours).
      try { var t = localStorage.getItem('modi.theme') || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'daylight' : 'graphite';
        document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
